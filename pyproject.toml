[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cotton-mcp-tools"
version = "0.1.0"
description = "A collection of MCP (Model Context Protocol) service tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
cotton-mcp-tools = "cotton_mcp_tools.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cotton_mcp_tools"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
